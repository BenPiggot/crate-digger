[project]
name = "crate-digger"
version = "0.1.0"
description = "Find every copy of a specific vinyl pressing for sale: Discogs for identification, eBay for live listings. Ships as an MCP server and a small web UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "mcp>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
crate-digger-mcp = "crate_digger.mcp_server:main"
crate-digger-web = "crate_digger.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crate_digger"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
